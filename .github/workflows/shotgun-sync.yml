# Ajoute automatiquement les nouvelles dates Shotgun sur la page Soirées.
# Tourne toutes les heures (et à la main : Actions → « Synchro Shotgun » → « Run workflow »).
#
# 1. récupère les événements de l'organisateur sur l'API Shotgun
# 2. ajoute dans soirees.html les dates à venir qui n'ont pas encore de carte
# 3. si la page a changé : commit dans le dépôt + envoi de soirees.html seul sur OVH
#
# Secrets à renseigner dans Settings → Secrets and variables → Actions :
#   SHOTGUN_TOKEN        (Smartboard → Settings → Integrations → Shotgun APIs → « Generate a token »)
#   SHOTGUN_ORGANIZER_ID (même page)
#   OVH_FTP_PASSWORD     (facultatif : sans lui, seul GitHub Pages est mis à jour)
name: Synchro Shotgun

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier-ovh
  cancel-in-progress: false

env:
  OVH_SERVEUR: ssh.cluster129.hosting.ovh.net
  OVH_LOGIN: versatv

jobs:
  synchro:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger les événements Shotgun
        env:
          SHOTGUN_TOKEN: ${{ secrets.SHOTGUN_TOKEN }}
          SHOTGUN_ORGANIZER_ID: ${{ secrets.SHOTGUN_ORGANIZER_ID }}
        run: |
          if [ -z "$SHOTGUN_TOKEN" ] || [ -z "$SHOTGUN_ORGANIZER_ID" ]; then
            echo "::error::Secrets SHOTGUN_TOKEN / SHOTGUN_ORGANIZER_ID manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          URL="https://smartboard-api.shotgun.live/api/shotgun/organizers/$SHOTGUN_ORGANIZER_ID/events"
          # Shotgun documente le token sous le nom "key" ; on essaie "token" si ça ne passe pas.
          curl -sfS "$URL?key=$SHOTGUN_TOKEN" -o shotgun-events.json \
            || curl -sfS "$URL?token=$SHOTGUN_TOKEN" -o shotgun-events.json \
            || curl -sfS -H "Authorization: Bearer $SHOTGUN_TOKEN" "$URL" -o shotgun-events.json
          echo "Réponse reçue ($(wc -c < shotgun-events.json) octets)"

      - name: Mettre à jour soirees.html
        run: node .github/scripts/shotgun-sync.mjs

      - name: Enregistrer dans le dépôt
        id: commit
        run: |
          if git diff --quiet -- soirees.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soirees.html
          git commit -m "Soirées : dates Shotgun mises à jour automatiquement"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Envoyer soirees.html sur OVH
        if: steps.commit.outputs.changed == 'true'
        env:
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          # Tant que le site vitrine n'est pas publié sur OVH (secret absent), on s'arrête là :
          # le commit sur main suffit pour mettre à jour la version GitHub Pages.
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::notice::OVH_FTP_PASSWORD absent : pas d'envoi sur OVH (GitHub Pages est mis à jour par le commit)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            open -u $OVH_LOGIN --env-password sftp://$OVH_SERVEUR;
            put soirees.html -o www/soirees.html;
          "
